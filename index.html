<!doctype html>
<html>
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Uploader</title></head>
  <body style="font-family:system-ui;max-width:640px;margin:2rem auto;padding:0 1rem">
    <h1>Upload CSV to GitHub</h1>
    <form id="form">
      <input type="file" id="file" name="file" accept=".csv" required>
      <button type="submit">Upload</button>
    </form>
    <pre id="out" style="white-space:pre-wrap;background:#f6f8fa;padding:1rem;border-radius:8px;margin-top:1rem"></pre>

    <script>
      const out = document.getElementById('out');
      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = document.getElementById('file').files[0];
        if (!f) return;
        out.textContent = "Uploading…";
        const fd = new FormData();
        fd.append('file', f);
        try {
          const res = await fetch('/api/upload', { method: 'POST', body: fd });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data?.error || res.statusText);
          out.textContent = `✅ Uploaded\nPath: ${data.path}\nCommit: ${data.commit}\nLink: ${data.html_url}`;
        } catch (err) {
          out.textContent = `❌ ${err.message}`;
        }
      });
    </script>
  </body>
</html>
